name: Deploy OLNOO Docs Bot

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-olnoo-docs-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            cd /opt/olnoo/projects/olnoo-docs-bot

            git fetch origin main
            git reset --hard origin/main

            npm ci

            npm run typecheck
            npm test

            systemctl restart driveset-docs-bot.service
            systemctl is-active --quiet driveset-docs-bot.service

            sleep 3
            systemctl is-active --quiet driveset-docs-bot.service
